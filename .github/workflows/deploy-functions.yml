      - name: Deploy
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
          npx firebase-tools@latest deploy --only functions --project $(cat /tmp/sa.json | python3 -c "import sys,json; print(json.load(sys.stdin)['project_id'])")
